name: Date républicaine quotidienne

on:
  schedule:
    # Plusieurs essais : GitHub peut retarder ou sauter un déclenchement.
    # Le premier qui passe publie, les suivants voient que c'est déjà fait.
    - cron: "5 5 * * *"    # 7 h 05 (été) / 6 h 05 (hiver) à Paris
    - cron: "37 5 * * *"
    - cron: "13 6 * * *"
    - cron: "47 7 * * *"
  workflow_dispatch: {}   # lancement manuel (publie même si déjà fait)

permissions:
  contents: read
  actions: write   # pour le cache et le keepalive

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - id: jour
        run: echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      - id: deja
        uses: actions/cache/restore@v4
        with:
          path: publie.txt
          key: publie-${{ steps.jour.outputs.date }}
          lookup-only: true
      - if: steps.deja.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - if: steps.deja.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.deja.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: pip install tweepy
      - if: steps.deja.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: python date_republicaine.py --publier
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - if: steps.deja.outputs.cache-hit != 'true'
        run: echo "${{ steps.jour.outputs.date }}" > publie.txt
      - if: steps.deja.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: publie.txt
          key: publie-${{ steps.jour.outputs.date }}
      # Évite que GitHub désactive le workflow après 60 jours sans commit
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publier.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
